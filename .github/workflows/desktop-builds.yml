name: Desktop builds

# macOS and Linux installers can't be built on Windows, so they're built here on demand
# (Actions → Desktop builds → Run workflow). scripts/publish-release.sh downloads the
# artifacts of the latest successful run and publishes them next to the Windows installers.
#
# macOS builds are ad-hoc signed: they run, but Gatekeeper asks the user to allow the app once
# (System Settings → Privacy & Security → Open Anyway), and auto-update needs a Developer ID.
# With an Apple Developer account, add CSC_LINK / CSC_KEY_PASSWORD and APPLE_ID /
# APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID secrets and drop the ad-hoc identity below.

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-14
            artifact: meetingly-mac
            package: npx electron-builder --mac --arm64 --x64 --publish never -c.mac.identity=-
          - name: Linux (AppImage + deb)
            os: ubuntu-22.04
            artifact: meetingly-linux
            package: npx electron-builder --linux AppImage deb --x64 --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run fetch:asr
      - run: npm run build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.blockmap
            app/release/latest-mac.yml
            app/release/latest-linux.yml
