# Lives inside the 443 server block of /etc/nginx/conf.d/aiprimetech.conf on Voyra.
# `^~` wins over the regex locations that follow. Needs the $connection_upgrade map
# (relay/nginx-upgrade-map.conf -> /etc/nginx/conf.d/00-connection-upgrade-map.conf).
# The public path stays /igpt/: every shipped app build calls https://aiprimetech.io/igpt.
    location ^~ /igpt/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;

        # WebSocket (Deepgram passthrough) and long-lived SSE (chat streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 8m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log /var/log/nginx/igpt.access.log;
    }
