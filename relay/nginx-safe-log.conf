# Install in the http context before the server configs (00-meetingly-safe-log.conf).
# Do not log query strings or Referer headers on relay routes: they can carry device credentials.
log_format meetingly_relay_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "-" "$http_user_agent"';
